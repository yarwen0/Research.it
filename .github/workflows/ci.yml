name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push makes an in-flight run for the same ref pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            be-main/requirements.txt
            be-main/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: mypy
        run: mypy

  backend-tests:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            be-main/requirements.txt
            be-main/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        # The floor ratchets up as the pre-refactor modules gain tests. It is
        # here to stop coverage sliding, not to claim the suite is thorough.
        run: pytest --cov --cov-report=term-missing --cov-fail-under=50

  backend-postgres:
    name: Backend schema and vector search (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be-main
    services:
      postgres:
        # Postgres with pgvector, which the chunks migration enables.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: researchit
          POSTGRES_PASSWORD: researchit
          POSTGRES_DB: researchit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://researchit:researchit@localhost:5432/researchit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            be-main/requirements.txt
            be-main/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply migrations
        # SQLite is forgiving in ways Postgres is not, so the schema is proven
        # against the engine production actually runs.
        run: alembic upgrade head
      - name: Check migrations match the models
        # Fails if a model was edited without generating a migration.
        run: alembic check
      - name: Vector search against pgvector
        # The pgvector query path runs only on Postgres, so the SQLite test
        # job never reaches it. These tests drop what they create, hence a
        # database of their own.
        env:
          PGPASSWORD: researchit
          TEST_POSTGRES_URL: postgresql+psycopg://researchit:researchit@localhost:5432/researchit_test
        run: |
          psql -h localhost -U researchit -d researchit -c "CREATE DATABASE researchit_test"
          pytest tests/test_chunk_store.py -k postgres

  api-types:
    name: Frontend types match the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: be-main/requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: fe-main/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          pip install -r be-main/requirements-dev.txt
          pnpm --dir fe-main install --frozen-lockfile
      - name: Regenerate from the live schema
        run: pnpm --dir fe-main generate:api-types
      - name: Fail if the committed types are stale
        # Catches a backend model change that never reached the frontend —
        # otherwise the drift only shows up as a runtime shape mismatch.
        run: git diff --exit-code -- fe-main/openapi.json fe-main/lib/api-types.ts

  evals:
    name: Gap detection and retrieval quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            be-main/requirements.txt
            be-main/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Report gap detection metrics
        # Printed to the log so a quality change is visible on every PR, not
        # only when the regression gate in tests/test_evals.py trips.
        run: python -m evals.run_eval
      - name: Report retrieval metrics
        # Same idea, for tests/test_retrieval_eval.py. Scored from committed
        # embeddings, so no model is needed.
        run: python -m evals.retrieval.run
      - name: Report prompt-injection screen metrics
        # Gated in tests/test_screening.py; printed here so held-out recall
        # and false positives on prose about attacks show up on every PR.
        run: python -m evals.injection.run

  infra:
    name: Google Cloud Terraform validates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/gcp/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Formatting
        run: terraform fmt -check -recursive
      - name: Validate against the provider schema
        # No backend and no credentials: this checks the configuration, not a
        # live project.
        run: |
          terraform init -backend=false -input=false
          terraform validate

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./be-main
          push: false
          # TeX Live is ~700 MB and irrelevant to whether the image builds.
          build-args: INSTALL_LATEX=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./fe-main
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe-main
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: fe-main/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: Frontend e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe-main
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: fe-main/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        # The backend is stubbed at the network layer, so no API, LLM or arXiv
        # access is needed here.
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: fe-main/playwright-report/
          retention-days: 7
