# Fly.io deployment for the Research.it backend.
#
#   fly launch --no-deploy --copy-config      # first time only
#   fly secrets set GEMINI_API_KEY=... CORS_ORIGINS=https://your-frontend
#   fly volumes create researchit_data --size 3
#   fly deploy
app = "researchit-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"

# Generated papers, graphs and reviews live here. Without a volume they are
# lost on every deploy.
[mounts]
  source = "researchit_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  # A research run streams for minutes, so keep machines up while requests are
  # in flight and suspend rather than stop once idle (faster cold start).
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 12

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

# The pipeline holds PDFs and embeddings in memory; 512 MB is not enough.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
